<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="An app asks Android for your IMEI, Doppel catches the call inside the app, and the app gets a fake IMEI">
<title>How Doppel works</title>
<style>@font-face{font-family:'PlexSans';font-weight:600;src:url(data:font/ttf;base64,) format('truetype')}@font-face{font-family:'PlexSans';font-weight:400;src:url(data:font/ttf;base64,) format('truetype')}.d{animation:go 2.4s ease-in-out infinite}.d2{animation-delay:1.2s}@keyframes go{from{transform:translateX(0)}to{transform:translateX(100px)}}@media (prefers-reduced-motion:reduce){.d{animation:none}}</style>
<rect x="30" y="44" width="320" height="112" rx="14" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="190.0" y="90" text-anchor="middle" font-family="PlexSans" font-weight="600" font-size="23" fill="#18161d">The app</text>
<text x="190.0" y="124" text-anchor="middle" font-family="PlexSans" font-size="18" fill="#6b6577">asks Android for your IMEI</text><rect x="440" y="44" width="320" height="112" rx="14" fill="#ffffff" stroke="#b0466e" stroke-width="2.5"/>
<text x="600.0" y="90" text-anchor="middle" font-family="PlexSans" font-weight="600" font-size="23" fill="#18161d">Doppel</text>
<text x="600.0" y="124" text-anchor="middle" font-family="PlexSans" font-size="18" fill="#6b6577">catches the call inside the app</text><rect x="850" y="44" width="320" height="112" rx="14" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="1010.0" y="90" text-anchor="middle" font-family="PlexSans" font-weight="600" font-size="23" fill="#18161d">The app</text>
<text x="1010.0" y="124" text-anchor="middle" font-family="PlexSans" font-size="18" fill="#6b6577">gets a fake IMEI and carries on</text><rect x="352" y="99.0" width="86" height="2" fill="#d1d9e0"/>
<circle class="d" cx="345" cy="100.0" r="6" fill="#b0466e"/><rect x="762" y="99.0" width="86" height="2" fill="#d1d9e0"/>
<circle class="d d2" cx="755" cy="100.0" r="6" fill="#1a7f37"/>
</svg>