[versions]
agp = "9.5.2"
# Kotlin is built into AGP 9, which compiles with the Kotlin Gradle plugin of the build classpath;
# Glide 5 ships Kotlin 2.4 metadata, which the 2.2.10 plugin of AGP cannot read
kotlin = "2.4.21"
appcompat = "1.8.0"
# Compose 1.10 is the last line which compiles against this project's compileSdk 37.0
composeBom = "2026.03.01"
core = "1.19.1"
splashscreen = "1.2.0"
glide = "5.0.10"
json = "20260814"
junit = "4.13.2"
libxposed = "102.0.0"
material = "1.14.0"
recyclerview = "1.4.0"
testExtJunit = "1.3.0"
testRunner = "1.7.0"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-core = { module = "androidx.core:core", version.ref = "core" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "testExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "testRunner" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
json = { module = "org.json:json", version.ref = "json" }
junit = { module = "junit:junit", version.ref = "junit" }
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed" }
libxposed-service = { module = "io.github.libxposed:service", version.ref = "libxposed" }
material = { module = "com.google.android.material:material", version.ref = "material" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Not applied: only puts the Kotlin Gradle plugin on the build classpath, for built-in Kotlin
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
