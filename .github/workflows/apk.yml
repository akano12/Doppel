name: Signed APK

# Builds the signed release APK and keeps it as an artifact of the run (no release is published).
# Needs the secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD. Start by hand: gh workflow run apk.yml
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The test of the versions of Downloads reads the history of git
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          # the job that holds the key saves no cache, which pull requests could read
          cache-read-only: true
      - name: Keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          SP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > release.keystore
          test -s release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$SP" "$KA" "$KP" > keystore.properties
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: One dex file, signed with the key of the earlier releases
        run: |
          apk=$(ls app/build/outputs/apk/release/*-release.apk)
          test "$(unzip -l "$apk" | grep -cE 'classes[0-9]*\.dex$')" = 1
          bt=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $bt/apksigner verify --print-certs "$apk" | grep -q 'SHA-256 digest: a0f21eb39512fa904f046cf166e78607f5954f00f143002d3589ea71fdea71f4'
      - uses: actions/upload-artifact@v7
        with:
          # the APK itself, not a zip; the artifact is named after the file
          path: app/build/outputs/apk/release/*-release.apk
          archive: false
      - name: Remove the keystore
        if: always()
        run: rm -f release.keystore keystore.properties
