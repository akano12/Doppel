import javax.inject.Inject

plugins {
    alias(libs.plugins.android.application)
}

// The hook definition repository (repo/) is packaged as assets/repo, to browse and install definitions offline
abstract class RepoAssetsTask extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getRepoDir()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void sync() {
        fs.sync { spec ->
            spec.from(repoDir)
            spec.into(outputDir.dir('repo'))
        }
    }
}

def repoAssets = tasks.register('repoAssets', RepoAssetsTask) {
    repoDir = rootProject.layout.projectDirectory.dir('repo')
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(repoAssets, { it.outputDir })
    }
}

// Release signing is optional: without keystore.properties the release build is left unsigned
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists())
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }

android {
    namespace = 'eu.faircode.xlua'
    compileSdk = 37

    defaultConfig {
        applicationId = 'eu.faircode.xlua'
        minSdk = 23
        targetSdk = 35
        versionCode = 137
        versionName = '1.36'
    }

    base {
        archivesName = "XPrivacyLua-v${android.defaultConfig.versionName}-${android.defaultConfig.versionCode}"
    }

    signingConfigs {
        if (keystoreProperties['storeFile']) {
            release {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProperties['storeFile'])
                signingConfig = signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        // Hook definitions use reflection on hidden framework APIs by design
        disable 'PrivateApi', 'DiscouragedPrivateApi', 'SoonBlockedPrivateApi', 'BlockedPrivateApi'
        // Translations are maintained externally
        disable 'MissingTranslation', 'ExtraTranslation'
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core
    implementation libs.androidx.drawerlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout
    implementation libs.material
    implementation libs.glide

    // Provided at runtime by the Xposed framework
    // Modern API: https://github.com/libxposed/api (LSPosed and compatible frameworks)
    compileOnly libs.libxposed.api
    // Legacy API: Xposed, EdXposed and older LSPosed versions
    compileOnly libs.xposed.api

    testImplementation libs.junit
    testImplementation libs.libxposed.api
    // Real implementation instead of the android.jar stubs
    testImplementation libs.json
}
