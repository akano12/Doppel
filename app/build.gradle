plugins {
    alias(libs.plugins.android.application)
}

// Release signing is optional: without keystore.properties the release build is left unsigned
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists())
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }

android {
    namespace = 'eu.faircode.xlua'
    compileSdk = 37

    defaultConfig {
        applicationId = 'eu.faircode.xlua'
        minSdk = 23
        targetSdk = 35
        versionCode = 137
        versionName = '1.36'
    }

    base {
        archivesName = "XPrivacyLua-v${android.defaultConfig.versionName}-${android.defaultConfig.versionCode}"
    }

    signingConfigs {
        if (keystoreProperties['storeFile']) {
            release {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProperties['storeFile'])
                signingConfig = signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        // Hook definitions use reflection on hidden framework APIs by design
        disable 'PrivateApi', 'DiscouragedPrivateApi', 'SoonBlockedPrivateApi', 'BlockedPrivateApi'
        // Translations are maintained externally
        disable 'MissingTranslation', 'ExtraTranslation'
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core
    implementation libs.androidx.drawerlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout
    implementation libs.material
    implementation libs.glide

    // Provided at runtime by the Xposed framework (LSPosed, EdXposed, Xposed)
    compileOnly libs.xposed.api
}
